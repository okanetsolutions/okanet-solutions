name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-fast:
    name: Fast checks
    runs-on: self-hosted
    environment: Testing

    env:
      COMPOSER_AUTH: >
        {"github-oauth": {"github.com": "${{ secrets.TOKEN_COMPOSER || github.token }}"}}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          clean: true
          fetch-depth: 0

      - name: Validate Composer configuration
        run: composer validate --check-lock

      - name: Install Node Dependencies
        uses: ./.github/actions/npm-install
        with:
          save-cache: 'true'

      - name: Install PHP Dependencies
        uses: ./.github/actions/composer-install
        with:
          save-cache: 'true'

      - name: Run Pint
        run: ./vendor/bin/pint --test --parallel

      - name: Run Grep checks
        run: |
          if grep -RIn --binary-files=without-match \
            --exclude-dir=.git --exclude-dir=vendor --exclude-dir=node_modules \
            --exclude='tests.yml' \
            -E '<<<<<<<|=======|>>>>>>>' .; then
            echo "Merge conflict markers found"
            exit 1
          fi

      - name: Run Composer Audit
        run: composer audit

  ci-slow:
    name: Tests and build
    runs-on: self-hosted
    environment: Testing

    env:
      COMPOSER_AUTH: >
        {"github-oauth": {"github.com": "${{ secrets.TOKEN_COMPOSER || github.token }}"}}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          clean: true

      - name: Install Node Dependencies
        uses: ./.github/actions/npm-install

      - name: Install PHP Dependencies
        uses: ./.github/actions/composer-install

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Cache configuration
        run: php artisan config:cache

      - name: Cache routes
        run: php artisan route:cache

      - name: Cache views
        run: php artisan view:cache

      - name: Build Assets
        run: npm run build

      - name: Clear cached bootstrap files
        run: |
          php artisan config:clear
          php artisan route:clear
          php artisan view:clear
          php artisan event:clear

      - name: Run Tests
        run: php artisan test --parallel
